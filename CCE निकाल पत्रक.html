<meta name="theme-color" content="#0a3d62">
<title>CCE निकाल पत्रक</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef2f5;--card:#fff;--tx:#14263a;--mu:#5d6b7a;--ac:#0b5c6b;--ac2:#e4f1f3;--bd:#cfd8e0;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--card:#17232f;--tx:#e6edf3;--mu:#97a6b5;--ac:#5cc2d1;--ac2:#18323a;--bd:#2c3d4d;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1a24;--card:#17232f;--tx:#e6edf3;--mu:#97a6b5;--ac:#5cc2d1;--ac2:#18323a;--bd:#2c3d4d;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:'Nirmala UI','Noto Sans Devanagari','Mukta',system-ui,sans-serif;font-size:15px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px}
.nav{display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:2px solid var(--ac);padding:6px 8px;position:sticky;top:0;z-index:5}
.nav button{white-space:nowrap;padding:7px 12px;border-radius:4px;color:var(--mu);font-weight:600}
.nav button.on{background:var(--ac);color:var(--card)}
input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:6px 8px;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{background:var(--ac);color:var(--card);padding:7px 14px;border-radius:4px;font-weight:600}
.btn.alt{background:var(--ac2);color:var(--ac);border:1px solid var(--ac)}
.btn.del{background:none;color:var(--bad);padding:2px 8px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--bd);padding:4px 6px;text-align:center;font-size:14px}
th{background:var(--ac2);color:var(--ac)}
td.l{text-align:left}
td input.m{width:64px;text-align:center}
.bad{color:var(--bad);font-weight:700}
.pg{page-break-after:always;margin-bottom:16px}
h2{font-size:19px;font-weight:700;margin:0 0 8px}
.lbl{display:block;font-size:13px;color:var(--mu);margin-bottom:2px}
body{font-size:16px;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0a3d62;z-index:30}
#hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;background:linear-gradient(135deg,#0a3d62,#0b6b6b);box-shadow:0 2px 8px #0003}
#hd #mb{font-size:24px;width:42px;height:42px;border-radius:10px;background:#ffffff22;color:#fff}
#ov{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}#ov.open{opacity:1;pointer-events:auto}
#dw{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:320px;background:var(--card);z-index:50;transform:translateX(-104%);transition:transform .25s;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:4px 0 16px #0004}#dw.open{transform:none}
.dh{display:flex;align-items:center;gap:12px;color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 18px;background:linear-gradient(135deg,#0a3d62,#0b6b6b);margin-bottom:6px}
.di{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;font-weight:600;text-align:left;border-left:4px solid transparent}.di span{font-size:20px}
.di.on{background:var(--ac2);color:var(--ac);border-left-color:#f59e0b}
.card{border-radius:14px;box-shadow:0 1px 4px #0a3d6214}
.btn{min-height:44px;border-radius:10px;padding:8px 16px}
input,select,textarea{font-size:16px;min-height:44px;border-radius:10px}
.fi input,.fi select{width:100%}
.ab{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:15}
.rn{width:40px;height:40px;border-radius:50%;background:var(--ac2);color:var(--ac);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.bd{display:inline-block;margin-top:2px;margin-right:4px;padding:1px 8px;border-radius:99px;background:#fde8c4;color:#8a5200;font-size:12px}
.sb{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:19;display:flex;gap:6px;overflow-x:auto;margin:0 -12px 8px;padding:8px 12px;background:var(--bg)}
.sb button{white-space:nowrap;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-weight:600;font-size:14px;color:var(--mu)}
.sb button.on{background:var(--ac);color:var(--card);border-color:var(--ac)}
.ch{font-style:normal;font-size:24px;line-height:1;transition:transform .2s;color:var(--mu)}.ch.o{transform:rotate(90deg)}

const GX=['वाटतो'],GB=['असते','करते','काढते','खेळते','घेते','बनवते','बाळगते','सांगते','सोडविते','होते'];
function gen(s,g){const D='[\\u0900-\\u097F\\u200d]';
 s=s.replace(new RegExp('('+D+'+)/('+D+'+)','g'),(m,a,b)=>/तो$/.test(a)&&/ते$/.test(b)?(g==='मुलगी'?b:a):m);
 if(g==='मुलगी')s=s.replace(new RegExp('('+D+'+)तो(?!'+D+')','g'),(m,a)=>GX.includes(a+'तो')?m:a+'ते').replace(/ता है/g,'ती है').replace(/\bhimself\b/g,'herself').replace(/\bhis\b/g,'her');
 else s=s.replace(new RegExp('(?<!'+D+')('+GB.join('|')+')(?!'+D+')','g'),(m,w)=>w.slice(0,-2)+'तो');
 return s}
